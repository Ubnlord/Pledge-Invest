name: Daily investor profit

on:
  schedule:
    # 23:00 UTC is 00:00 in Africa/Lagos (UTC+1).
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: pledge-daily-investor-profit
  cancel-in-progress: false

jobs:
  accrue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run daily profit accrual using GitHub OIDC
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("pledge-investor-profit-scheduler");
            const response = await fetch(
              "https://xypcqtqmekrjgytivmsm.supabase.co/functions/v1/pledge-api/api/internal/cron/daily-profit",
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                },
                body: "{}",
              },
            );
            const result = await response.json();
            core.info(JSON.stringify(result));
            if (!response.ok) {
              core.setFailed(`Daily profit endpoint returned HTTP ${response.status}`);
            } else if (Number(result.failed || 0) > 0) {
              core.setFailed("One or more profit credits failed; inspect the response and financial ledger.");
            } else if (result.skipped) {
              core.info("Daily profit is disabled; no credits were applied.");
            } else {
              core.info(`Accrual complete for ${result.day}: ${result.updated} credits, ${result.failed} failures.`);
            }
