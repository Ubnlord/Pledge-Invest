name: Validate Pledge Invest (no deployment)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Check financial safety invariants
        run: node scripts/check-financial-safety.mjs
      - name: Verify GitHub OIDC trust against production endpoint
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("pledge-investor-profit-scheduler");
            const response = await fetch(
              "https://xypcqtqmekrjgytivmsm.supabase.co/functions/v1/pledge-api/api/internal/cron/verify",
              {
                method: "POST",
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                },
                body: "{}",
              },
            );
            const result = await response.json();
            core.info(JSON.stringify(result));
            if (!response.ok || result.success !== true) {
              core.setFailed(`Production OIDC verification failed with HTTP ${response.status}`);
            }
      - name: Type-check TypeScript
        run: npx tsc --noEmit
      - name: Build production assets (no deployment)
        if: always()
        run: npm run build
